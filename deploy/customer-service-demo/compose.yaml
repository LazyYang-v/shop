name: shop-customer-service-demo

x-logless: &logless
  logging:
    driver: none
  restart: "no"

services:
  shop-db:
    <<: *logless
    image: ${SHOP_POSTGRES_IMAGE:?set a postgres16 image pinned by digest}
    environment:
      POSTGRES_USER: shop_demo
      POSTGRES_PASSWORD: ${DEMO_SHOP_DB_PASSWORD:?set a new demo password}
      POSTGRES_DB: shop_customer_service_demo
    volumes:
      - shop-db:/var/lib/postgresql/data
    networks: [shop]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U shop_demo -d shop_customer_service_demo"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Deliberately opt-in: current API does not implement the approved demo guards.
  shop-api:
    <<: *logless
    profiles: [pending-demo-guards]
    image: ${DEMO_SHOP_API_IMAGE:?set the reviewed local API image}
    environment:
      SHOP_DATABASE_URL: postgresql+psycopg://shop_demo:${DEMO_SHOP_DB_PASSWORD}@shop-db:5432/shop_customer_service_demo
      SHOP_COOKIE_SECURE: "false"
    ports: ["127.0.0.1:${DEMO_SHOP_PORT:-18011}:8000"]
    networks: [shop, retrieval]
    depends_on:
      shop-db:
        condition: service_healthy

  postgres:
    <<: *logless
    image: paradedb/paradedb@sha256:58bf87d2a6f1e72f56590b0f0ae1467e82c3f99ca203dde646672c8ac13148b2
    environment:
      POSTGRES_USER: weknora_demo
      POSTGRES_PASSWORD: ${DEMO_WEKNORA_DB_PASSWORD:?set a new demo password}
      POSTGRES_DB: weknora_customer_service_demo
    volumes: [weknora-db:/var/lib/postgresql/data]
    networks: [retrieval]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U weknora_demo -d weknora_customer_service_demo"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    <<: *logless
    image: redis@sha256:c9d92d840fd011c908f040592857c724ae6d877f2aba5c40ad963276507386b2
    # Ephemeral limiter/queue state; restart behavior must be verified before use.
    command: [redis-server, --appendonly, "no", --save, ""]
    networks: [retrieval]
    tmpfs: [/data]

  docreader:
    <<: *logless
    image: wechatopenai/weknora-docreader@sha256:9af668ac0ac857b9dfe8430d0fe77c0e5ad2636dc2b5285cd5500a13d5a35266
    environment:
      LOG_LEVEL: info
      DOCREADER_IMAGE_OUTPUT_DIR: /tmp/docreader
    volumes: [docreader-tmp:/tmp/docreader]
    networks: [retrieval]
    healthcheck:
      test: [CMD, grpc_health_probe, "-addr=localhost:50051"]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    <<: *logless
    image: wechatopenai/weknora-app@sha256:b5f96b13c2f69779af8c7291264cafbda64c208398b019e3a6223c6f3ea82031
    environment:
      LOG_LEVEL: info
      LOG_PATH: ""
      LLM_DEBUG_LOG: "false"
      GIN_MODE: release
      TZ: UTC
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: weknora_demo
      DB_PASSWORD: ${DEMO_WEKNORA_DB_PASSWORD}
      DB_NAME: weknora_customer_service_demo
      RETRIEVE_DRIVER: postgres
      REDIS_ADDR: redis:6379
      REDIS_DB: "0"
      REDIS_PREFIX: customer-service-demo
      STORAGE_TYPE: local
      LOCAL_STORAGE_BASE_DIR: /data/files
      DOCREADER_ADDR: docreader:50051
      JWT_SECRET: ${DEMO_WEKNORA_JWT_SECRET:?set a new random demo signing secret}
      DISABLE_REGISTRATION: "true"
      WEKNORA_SANDBOX_DOCKER_ENABLED: "false"
    volumes:
      - weknora-files:/data/files
      - docreader-tmp:/tmp/docreader:ro
      - type: bind
        source: ${DEMO_WEKNORA_CONFIG:?set an absolute path to a reviewed demo-only config}
        target: /app/config/config.yaml
        read_only: true
        bind:
          create_host_path: false
    networks: [retrieval]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      docreader:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8080/health]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  mcp-proxy:
    <<: *logless
    image: wechatopenai/weknora-ui@sha256:94f7992e963b1e2e3b8dc429091f1204fde9c3cd985175b16f40b4142f915fe5
    entrypoint: [nginx, -g, "daemon off;"]
    ports: ["127.0.0.1:${DEMO_MCP_PORT:-18081}:80"]
    volumes:
      - type: bind
        source: ./nginx-mcp.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind:
          create_host_path: false
    networks: [retrieval]
    depends_on:
      app:
        condition: service_healthy

networks:
  shop:
    internal: true
  retrieval:
    internal: true

volumes:
  shop-db:
  weknora-db:
  weknora-files:
  docreader-tmp:
