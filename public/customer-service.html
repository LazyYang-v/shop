<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>淘小蜜 · 联系客服</title>
  <style>
    * { box-sizing: border-box; }
    :root { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; color: #20242e; background: #eeefef; }
    body { margin: 0; min-width: 320px; }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid #ed853e; outline-offset: 4px; }
    .page { min-height: 100dvh; display: grid; place-items: center; padding: 40px; background: radial-gradient(ellipse at 20% 15%, #f9f7f4, transparent 65%), #e7e5e1; }
    .chat { position: relative; width: min(1300px, 100%); height: min(950px, calc(100dvh - 80px)); min-height: 580px; display: flex; flex-direction: column; overflow: hidden; background: linear-gradient(180deg, #f7f7f6 0%, #f8f7f4 62%, #fff6e7 84%, #ffdfb9 100%); box-shadow: 0 18px 70px #29221b12; }
    .heading { display: flex; align-items: center; gap: 19px; flex-shrink: 0; padding: 20px 26px; }
    .back { display: flex; color: inherit; text-decoration: none; }
    .heading h1 { margin: 0; font-size: 27px; font-weight: 600; }
    .heading .feedback { margin-left: auto; display: grid; justify-items: center; gap: 1px; border: 0; background: none; color: inherit; font-size: 10px; font-weight: 600; }
    .account-bar { display: flex; align-items: center; gap: 12px; padding: 0 26px 12px; font-size: 14px; color: #6b7077; }
    .account-bar button { padding: 5px 13px; border: 1px solid #f1d0ae; border-radius: 6px; background: #fff; color: #b85f22; }
    .login-panel { position: absolute; z-index: 4; inset: 0; display: grid; place-items: center; padding: 24px; background: #29221b66; }
    .login-panel[hidden] { display: none; }
    .login-panel form { width: min(420px, 100%); display: grid; gap: 14px; padding: 26px; border-radius: 10px; background: #fff; box-shadow: 0 18px 60px #29221b40; }
    .login-panel h2 { margin: 0 0 4px; font-size: 21px; }
    .login-panel label { display: grid; gap: 6px; font-size: 14px; color: #6b7077; }
    .login-panel input { height: 44px; padding: 0 12px; border: 1px solid #d8d5d0; border-radius: 7px; font-size: 16px; }
    .login-panel .login-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .login-panel .login-actions button { padding: 8px 18px; border: 0; border-radius: 7px; background: #fa914f; color: #fff; }
    .login-panel .login-actions button.secondary { background: #ece9e4; color: #333; }
    .login-error { min-height: 20px; margin: 0; color: #b3261e; font-size: 14px; }
    svg { display: block; width: 29px; height: 29px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .messages { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #dededb transparent; padding: 15px 20px 28px; }
    .history { display: block; margin: 5px auto 24px; padding: 4px 8px; border: 0; background: none; color: #389bcf; font-size: 18px; }
    .message { display: flex; align-items: flex-start; gap: 10px; margin: 0 0 18px; }
    .avatar { width: 50px; height: 51px; flex-shrink: 0; display: grid; place-items: center; border-radius: 9px; background: linear-gradient(140deg, #ffe5bd, #ffd393); font-size: 35px; overflow: hidden; }
    .bubble { max-width: min(80%, 780px); padding: 19px 20px; border-radius: 9px; background: #fff; font-size: 23px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .quick-questions { display: grid; gap: 12px; width: min(585px, calc(100% - 60px)); margin: 0 0 20px 60px; }
    .quick-question { position: relative; min-height: 53px; padding: 10px 32px; border: 1.5px solid #e99560; border-radius: 8px; background: #fff0df80; color: #df752f; font-size: 21px; font-weight: 600; }
    .quick-question:hover { background: #ffe6cc; }
    .confirmation-card { width: min(585px, calc(100% - 60px)); margin: 0 0 20px 60px; padding: 16px 18px; border: 1.5px solid #e99560; border-radius: 9px; background: #fff8ef; font-size: 17px; line-height: 1.65; }
    .confirmation-card h2 { margin: 0 0 8px; font-size: 19px; color: #8a4315; }
    .confirmation-card p { margin: 4px 0; }
    .confirmation-card .consequences { margin: 10px 0; color: #6b3a16; }
    .confirmation-card .unavailable { margin: 12px 0 8px; color: #8a5a33; font-size: 15px; }
    .confirmation-card button { min-height: 44px; padding: 8px 18px; border: 0; border-radius: 7px; background: #e7d7c8; color: #7b6a5c; font-size: 16px; cursor: not-allowed; }
    .confirmation-card button[data-confirmation-action] { opacity: .85; }
    .confirmation-card .invalid-note { margin: 10px 0 0; color: #b3261e; font-size: 14px; }
    .hot { position: absolute; top: -8px; left: -2px; display: grid; place-items: center; width: 21px; height: 21px; border-radius: 50%; background: #f44e42; color: #fff; font-size: 13px; font-weight: 400; }
    .chevron { position: absolute; right: 14px; top: 50%; width: 9px; height: 9px; border-top: 1.5px solid currentColor; border-right: 1.5px solid currentColor; transform: translateY(-50%) rotate(45deg); }
    .message.user { justify-content: flex-end; }
    .message.user .bubble { background: #ffdfb7; }
    .composer { padding: 10px 19px 14px; }
    .shortcuts { display: flex; align-items: center; gap: 18px; margin-bottom: 23px; padding: 0 12px; }
    .shortcut-arrow { color: #969b9f; font-size: 29px; line-height: 1; }
    .shortcut-arrow:last-child { margin-left: auto; }
    .order-link { position: relative; display: flex; align-items: center; gap: 8px; padding: 8px 17px; border: 1px solid #f1d0ae; border-radius: 7px; background: #fff; color: inherit; text-decoration: none; font-size: 21px; }
    .order-link svg { width: 23px; height: 23px; color: #fa782b; }
    .order-link::after { content: ''; position: absolute; right: 2px; top: 2px; width: 9px; height: 9px; border-radius: 50%; background: #e52a28; }
    .input-row { display: flex; gap: 12px; align-items: center; }
    .tools { display: flex; gap: 11px; }
    .tool { display: grid; place-items: center; width: 49px; height: 49px; padding: 10px; border: 0; border-radius: 8px; background: #fff; color: #252b34; text-decoration: none; }
    .input-row input { flex: 1; min-width: 0; height: 49px; padding: 0 17px; border: 0; border-radius: 8px; background: #fff; color: #252b34; font-size: 20px; }
    .input-row input::placeholder { color: #90969e; }
    .send { height: 49px; padding: 0 23px; border: 0; border-radius: 8px; background: #fa914f; color: #fff; font-size: 20px; }
    .send:disabled { opacity: .55; cursor: default; }
    .emoji-picker { display: flex; gap: 10px; margin-bottom: 12px; }
    .emoji-picker[hidden] { display: none; }
    .emoji-picker button { border: 0; border-radius: 7px; padding: 6px 10px; background: #fff; font-size: 23px; }
    @media (max-width: 700px) {
      .page { padding: 0; }
      .chat { width: 100%; height: 100dvh; min-height: 0; box-shadow: none; }
      .heading { padding: 17px 16px; gap: 13px; }
      .heading h1 { font-size: 23px; }
      .account-bar { padding: 0 16px 10px; font-size: 13px; gap: 8px; }
      .login-panel { padding: 14px; }
      .messages { padding: 12px 12px 20px; }
      .history { font-size: 14px; margin-bottom: 24px; }
      .avatar { width: 38px; height: 40px; font-size: 28px; }
      .message { gap: 8px; margin-bottom: 15px; }
      .bubble { font-size: 16px; padding: 13px 12px; max-width: calc(100% - 48px); }
      .quick-questions { margin-left: 46px; width: calc(100% - 46px); gap: 11px; }
      .quick-question { min-height: 46px; font-size: 16px; padding: 10px 22px; }
      .confirmation-card { width: calc(100% - 46px); margin-left: 46px; font-size: 15px; padding: 13px 14px; }
      .composer { padding: 10px 12px max(12px, env(safe-area-inset-bottom)); }
      .shortcuts { margin-bottom: 14px; padding: 0 3px; gap: 12px; }
      .order-link { font-size: 16px; padding: 8px 12px; }
      .input-row { flex-wrap: wrap; gap: 9px; }
      .tools { width: 100%; gap: 9px; }
      .tool { width: 36px; height: 36px; padding: 7px; }
      .tool svg { width: 24px; height: 24px; }
      .input-row input { font-size: 16px; height: 44px; }
      .send { height: 44px; padding: 0 18px; font-size: 16px; }
    }
  </style>
</head>
<body>
  <svg style="display:none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="arrow" viewBox="0 0 24 24"><path d="M20 12H4m8-8-8 8 8 8"/></symbol>
    <symbol id="document" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="18" rx="3"/><rect x="8" y="2" width="8" height="5" rx="2" fill="white"/><path d="M8 11h8m-8 4h8m-8 4h5"/></symbol>
    <symbol id="picture" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="4"/><path d="m5 17 5-5 4 3 5-6"/><circle cx="8" cy="8" r="1"/></symbol>
    <symbol id="camera" viewBox="0 0 24 24"><path d="M8 5 10 2h4l2 3h3a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z"/><circle cx="12" cy="13" r="5"/></symbol>
    <symbol id="smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1 3 4 3 4-3 4-3M8 8v2m8-2v2"/></symbol>
    <symbol id="feedback" viewBox="0 0 24 24"><path d="M8 21H5a3 3 0 0 1-3-3V5a3 3 0 0 1 3-3h13a3 3 0 0 1 3 3v8M7 7h9M7 11h6M7 15h3m5 7 6-6m-7 3 3 3"/></symbol>
  </svg>
  <main class="page">
    <section class="chat" aria-label="联系客服">
      <header class="heading">
        <a class="back" href="/" aria-label="返回商城首页"><svg><use href="#arrow"/></svg></a>
        <h1>淘小蜜</h1>
        <button class="feedback" type="button" aria-label="反馈"><svg><use href="#feedback"/></svg><span>反馈</span></button>
      </header>
      <div class="account-bar">
        <span id="account-status">未登录 · 登录后可查询本人订单</span>
        <button id="login-button" type="button">登录</button>
        <button id="logout-button" type="button" hidden>退出</button>
      </div>
      <div class="login-panel" id="login-panel" role="dialog" aria-modal="true" aria-labelledby="login-title" hidden>
        <form id="login-form">
          <h2 id="login-title">登录后查看本人订单</h2>
          <label>邮箱<input id="login-email" type="email" autocomplete="username" required maxlength="320"></label>
          <label>密码<input id="login-password" type="password" autocomplete="current-password" required minlength="12" maxlength="128"></label>
          <p class="login-error" id="login-error" role="alert"></p>
          <div class="login-actions">
            <button class="secondary" id="login-cancel" type="button">取消</button>
            <button id="login-submit" type="submit">登录</button>
          </div>
        </form>
      </div>
      <div class="messages" id="messages" role="log" aria-label="客服聊天记录" aria-live="polite">
        <button class="history" type="button">点击查看历史咨询记录</button>
        <div class="message"><span class="avatar" aria-hidden="true">👩🏻‍💼</span><div class="bubble">亲，我是智能小蜜，很高兴为您服务！</div></div>
        <div class="message"><span class="avatar" aria-hidden="true">👩🏻‍💼</span><div class="bubble">访客可匿名查询虚构演示商品。登录买家可查询本人订单及商城已保存的物流信息；即使只有一单，也需要您亲自选择。匿名会话自建立起30分钟有效。可问“有哪些商品？”或完整商品名称加“多少钱”“有货吗”“价格和库存”；也可咨询标注为“虚构演示政策（非真实商城政策）”的合成规则，例如“演示商城多久发货？”。退款、发券、催发货、转人工和实时轨迹暂不支持。</div></div>
        <div class="quick-questions" aria-label="热门咨询">
          <button class="quick-question" id="start-consultation" type="button">开始商品咨询<span class="chevron" aria-hidden="true"></span></button>
          <button class="quick-question" id="list-products" type="button">查看演示商品<span class="chevron" aria-hidden="true"></span></button>
          <button class="quick-question" id="query-orders" type="button">查询我的订单<span class="chevron" aria-hidden="true"></span></button>
        </div>
      </div>
      <div class="composer">
        <div class="shortcuts"><span class="shortcut-arrow" aria-hidden="true">‹</span><a href="/?view=orders" class="order-link"><svg><use href="#document"/></svg>发订单给客服</a><span class="shortcut-arrow" aria-hidden="true">›</span></div>
        <div class="emoji-picker" id="emoji-picker" hidden aria-label="选择表情"><button type="button">😊</button><button type="button">👍</button><button type="button">❤️</button><button type="button">🙏</button></div>
        <form class="input-row" id="chat-form">
          <div class="tools">
            <a class="tool" href="/?view=orders" aria-label="我的订单"><svg><use href="#document"/></svg></a>
            <button class="tool" type="button" id="picture-button" aria-label="发送图片"><svg><use href="#picture"/></svg></button>
            <button class="tool" type="button" id="camera-button" aria-label="拍照"><svg><use href="#camera"/></svg></button>
            <button class="tool" type="button" id="emoji-button" aria-label="选择表情" aria-expanded="false"><svg><use href="#smile"/></svg></button>
          </div>
          <input id="message-input" aria-label="请输入想咨询的问题" placeholder="请输入想咨询的问题" autocomplete="off" maxlength="2000">
          <button class="send" id="send-button" type="submit" disabled>发送</button>
        </form>
      </div>
    </section>
  </main>
  <script>
    const messages = document.getElementById('messages');
    const input = document.getElementById('message-input');
    const sendButton = document.getElementById('send-button');
    function appendMessage(text, user = false) {
      const row = document.createElement('div');
      row.className = user ? 'message user' : 'message';
      if (!user) {
        const avatar = document.createElement('span');
        avatar.className = 'avatar';
        avatar.setAttribute('aria-hidden', 'true');
        avatar.textContent = '👩🏻‍💼';
        row.append(avatar);
      }
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      row.append(bubble);
      messages.append(row);
      messages.scrollTop = messages.scrollHeight;
    }
    function submitMessage(text) {
      if (!text.trim()) return;
      appendMessage(text.trim(), true);
      input.value = '';
      sendButton.disabled = true;
      consultText(text.trim());
    }
    input.addEventListener('input', () => { sendButton.disabled = !input.value.trim(); });
    document.getElementById('chat-form').addEventListener('submit', event => {
      event.preventDefault();
      submitMessage(input.value);
    });
    let consultation = null;
    let confirmation = null;
    let selectedOrderNumber = null;
    let consultationBusy = false;
    let renewalTimer = null;
    const confirmationTimers = new Map();
    const handoffKey = 'shop.customer-service.handoff';
    function saveHandoff(token) {
      try {
        if (typeof token === 'string' && /^[A-Za-z0-9_-]{43}$/.test(token)) sessionStorage.setItem(handoffKey, token);
        else sessionStorage.removeItem(handoffKey);
      } catch { /* Storage may be disabled; a new consultation remains available. */ }
    }
    function takeHandoff() {
      try {
        const token = sessionStorage.getItem(handoffKey);
        sessionStorage.removeItem(handoffKey);
        return token && /^[A-Za-z0-9_-]{43}$/.test(token) ? token : null;
      } catch { return null; }
    }
    function invalidateConsultation() {
      consultation = null;
      confirmation = null;
      selectedOrderNumber = null;
      clearTimeout(renewalTimer);
      saveHandoff(null);
      expireConfirmationCards('咨询已失效，请重新开始并选择订单。');
      messages.querySelectorAll('[data-consultation-action], [data-confirmation-action]')
        .forEach(button => { button.disabled = true; });
    }
    function expireConfirmationCard(section, note) {
      section.querySelectorAll('[data-confirmation-action]').forEach(button => { button.disabled = true; });
      if (section.querySelector('.invalid-note')) return;
      const expired = document.createElement('p');
      expired.className = 'invalid-note';
      expired.textContent = note;
      section.append(expired);
    }
    function expireConfirmationCards(note) {
      for (const timer of confirmationTimers.values()) clearTimeout(timer);
      confirmationTimers.clear();
      confirmation = null;
      messages.querySelectorAll('.confirmation-card').forEach(section => expireConfirmationCard(section, note));
    }
    function armConfirmationExpiry(section, card) {
      const deadline = Date.parse(card.expires_at);
      const expire = () => {
        if (confirmation && confirmation.operationId === card.operation_id) confirmation = null;
        expireConfirmationCard(section, '确认方案已过期，请重新申请取消方案。');
      };
      if (!Number.isFinite(deadline) || deadline <= Date.now()) {
        expire();
        return;
      }
      const timer = setTimeout(() => {
        confirmationTimers.delete(card.operation_id);
        expire();
      }, deadline - Date.now());
      confirmationTimers.set(card.operation_id, timer);
    }
    const accountStatus = document.getElementById('account-status');
    const loginButton = document.getElementById('login-button');
    const logoutButton = document.getElementById('logout-button');
    const loginPanel = document.getElementById('login-panel');
    const loginError = document.getElementById('login-error');
    let accountBusy = false;
    function showLogin(message = '') {
      loginError.textContent = message;
      loginPanel.hidden = false;
      document.getElementById('login-email').focus();
    }
    function hideLogin() {
      loginPanel.hidden = true;
      loginError.textContent = '';
      document.getElementById('login-password').value = '';
    }
    async function accountPost(path, payload) {
      return withSessionLane(async () => {
        const csrfResponse = await fetch('/api/auth/csrf', { credentials: 'same-origin', cache: 'no-store' });
        if (!csrfResponse.ok) throw new Error('Authentication unavailable');
        const csrf = await csrfResponse.json();
        return fetch(path, {
          method: 'POST', credentials: 'same-origin', cache: 'no-store',
          headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf.csrf_token },
          body: JSON.stringify(payload), signal: AbortSignal.timeout(10000),
        });
      });
    }
    async function refreshAccount() {
      try {
        const response = await fetch('/api/auth/me', { credentials: 'same-origin', cache: 'no-store' });
        if (response.ok) {
          const user = await response.json();
          if (typeof user?.id !== 'string' || !['buyer', 'admin'].includes(user.role)) throw new Error('Invalid account');
          accountStatus.textContent = user.role === 'buyer' ? '已登录买家' : '已登录账号';
          loginButton.hidden = true;
          logoutButton.hidden = false;
          return true;
        }
      } catch { /* Keep the signed-out default; the server still enforces identity. */ }
      accountStatus.textContent = '未登录 · 登录后可查询本人订单';
      loginButton.hidden = false;
      logoutButton.hidden = true;
      return false;
    }
    loginButton.addEventListener('click', () => showLogin());
    document.getElementById('login-cancel').addEventListener('click', hideLogin);
    document.getElementById('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      if (accountBusy) return;
      accountBusy = true;
      const submit = document.getElementById('login-submit');
      submit.disabled = true;
      loginError.textContent = '';
      try {
        const response = await accountPost('/api/auth/login', {
          email: document.getElementById('login-email').value.trim(),
          password: document.getElementById('login-password').value,
        });
        if (!response.ok) {
          loginError.textContent = response.status === 401 ? '登录失败，请检查邮箱和密码。' : '登录暂不可用，请稍后重试。';
          return;
        }
        invalidateConsultation();
        window.location.reload();
      } catch {
        loginError.textContent = '登录暂不可用，请稍后重试。';
      } finally {
        accountBusy = false;
        submit.disabled = false;
      }
    });
    logoutButton.addEventListener('click', async () => {
      if (accountBusy) return;
      accountBusy = true;
      logoutButton.disabled = true;
      try {
        const response = await accountPost('/api/auth/logout', {});
        if (response.ok) {
          invalidateConsultation();
          window.location.reload();
          return;
        }
        appendMessage('退出未能确认，请稍后重试。');
      } catch {
        appendMessage('退出未能确认，请稍后重试。');
      } finally {
        accountBusy = false;
        logoutButton.disabled = false;
      }
    });
    function scheduleRenewal() {
      clearTimeout(renewalTimer);
      if (!consultation) return;
      renewalTimer = setTimeout(() => { if (consultation) renewNow(); }, 30000);
    }
    function scheduleRenewalRetry() {
      // A transient renewal failure keeps the page and any confirmation card;
      // retry at the renewal limit rather than discarding still-valid state.
      clearTimeout(renewalTimer);
      if (!consultation) return;
      renewalTimer = setTimeout(() => { if (consultation) renewNow(); }, 15000);
    }
    let renewalInFlight = false;
    async function renewNow() {
      if (!consultation || renewalInFlight) return;
      renewalInFlight = true;
      const current = consultation;
      try {
        const renewed = await consultationPost('pages/renew', {
          page_instance_id: current.page_instance_id, handoff_token: current.handoff_token,
        });
        if (consultation !== current) return;
        if (renewed) scheduleRenewal();
        else scheduleRenewalRetry();
      } catch {
        if (consultation === current) scheduleRenewalRetry();
      } finally {
        renewalInFlight = false;
      }
    }
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && consultation) renewNow();
    });
    window.addEventListener('pagehide', () => clearTimeout(renewalTimer));
    window.addEventListener('pageshow', event => {
      if (event.persisted) invalidateConsultation();
    });
    // Keep every CSRF rotation in this page behind the POST using its token.
    // Recover the queue after failures; never replay a request.
    let sessionLane = Promise.resolve();
    function withSessionLane(action) {
      const result = sessionLane.then(action);
      sessionLane = result.catch(() => {});
      return result;
    }
    function consultationPost(path, payload) {
      return withSessionLane(() => consultationPostInLane(path, payload));
    }
    async function consultationPostInLane(path, payload) {
      const csrfResponse = await fetch('/api/auth/csrf', { credentials: 'same-origin', cache: 'no-store' });
      if (!csrfResponse.ok) throw new Error('Authentication unavailable');

          button.textContent = '下一页演示商品';
          button.addEventListener('click', () => queryProducts(null, page + 1));
          messages.append(button);
        }
        messages.scrollTop = messages.scrollHeight;
      } catch {
        appendMessage('商品查询服务暂不可用，请稍后重试。');
      } finally {
        clearTimeout(timer);
        queryingProducts = false;
      }
    }
    document.getElementById('list-products').addEventListener('click', () => queryProducts());
    document.querySelector('.history').addEventListener('click', () => appendMessage('当前页面中的消息即为本次咨询记录，暂未接入历史咨询记录。'));
    document.querySelector('.feedback').addEventListener('click', () => appendMessage('亲，反馈服务暂未接通。如需查看商城使用说明，请前往帮助中心。'));
    ['picture-button', 'camera-button'].forEach(id => document.getElementById(id).addEventListener('click', () => appendMessage('亲，图片消息暂未接通，您可以先在输入框中描述问题。')));
    const emojiPicker = document.getElementById('emoji-picker');
    const emojiButton = document.getElementById('emoji-button');
    emojiButton.addEventListener('click', () => {
      emojiPicker.hidden = !emojiPicker.hidden;
      emojiButton.setAttribute('aria-expanded', String(!emojiPicker.hidden));
    });
    emojiPicker.querySelectorAll('button').forEach(button => button.addEventListener('click', () => {
      input.value += button.textContent;
      sendButton.disabled = false;
      input.focus();
    }));
    refreshAccount();
  </script>
</body>
</html>
